<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="690" viewBox="0 0 600 690" role="img" aria-label="spesim logo: minimal hexagon with point pattern">
  <defs>
    <clipPath id="clipHexD">
      <path d="M300 40 L520 165 L520 425 L300 550 L80 425 L80 165 Z"/>
    </clipPath>
  </defs>

  <!-- Minimal Marine-Biology-ish palette -->
  <path d="M300 40 L520 165 L520 425 L300 550 L80 425 L80 165 Z" fill="#F8F9FA"/>
  <path d="M300 40 L520 165 L520 425 L300 550 L80 425 L80 165 Z" fill="none" stroke="#22223B" stroke-width="12"/>

  <g clip-path="url(#clipHexD)">
    <!-- fine grid hint (sampling design) -->
    <g stroke="#22223B" stroke-width="2" opacity="0.12">
      <path d="M110 210 H490"/>
      <path d="M110 260 H490"/>
      <path d="M110 310 H490"/>
      <path d="M110 360 H490"/>
      <path d="M110 410 H490"/>
      <path d="M160 170 V510"/>
      <path d="M220 170 V510"/>
      <path d="M280 170 V510"/>
      <path d="M340 170 V510"/>
      <path d="M400 170 V510"/>
      <path d="M460 170 V510"/>
    </g>

    <!-- clustered points (community) -->
    <g fill="#4A4E69" opacity="0.95">
      <circle cx="185" cy="250" r="7"/>
      <circle cx="205" cy="235" r="6"/>
      <circle cx="225" cy="255" r="6"/>
      <circle cx="415" cy="310" r="7"/>
      <circle cx="395" cy="295" r="6"/>
      <circle cx="430" cy="290" r="6"/>
      <circle cx="300" cy="420" r="7"/>
      <circle cx="280" cy="405" r="6"/>
      <circle cx="320" cy="405" r="6"/>
    </g>

    <!-- sampling quadrat highlight -->
    <rect x="255" y="235" width="90" height="90" fill="none" stroke="#9A8C98" stroke-width="8" opacity="0.9"/>
  </g>

  <text x="300" y="635" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#22223B">spesim</text>
</svg>
