<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="spesim logo: hexagon with spatial points and sampling quadrat (variant)">
  <defs>
    <linearGradient id="bgA2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0A0F24"/>
      <stop offset="100%" stop-color="#23395B"/>
    </linearGradient>
    <filter id="shadowA2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <clipPath id="clipHexA2">
      <path d="M300 40 L520 165 L520 425 L300 550 L80 425 L80 165 Z"/>
    </clipPath>
  </defs>

  <!-- Hexagon base -->
  <path d="M300 40 L520 165 L520 425 L300 550 L80 425 L80 165 Z" fill="url(#bgA2)" filter="url(#shadowA2)"/>
  <path d="M300 40 L520 165 L520 425 L300 550 L80 425 L80 165 Z" fill="none" stroke="#F2F4F8" stroke-width="10"/>

  <g clip-path="url(#clipHexA2)">
    <!-- environmental surface feel -->
    <path d="M70 240 C 180 120, 310 160, 560 120 L 560 520 L 70 520 Z" fill="#5BC0BE" opacity="0.12"/>
    <path d="M70 190 C 210 110, 330 140, 560 90" fill="none" stroke="#E0E1DD" stroke-width="5" opacity="0.18"/>

    <!-- quadrat -->
    <rect x="210" y="230" width="180" height="180" fill="none" stroke="#5BC0BE" stroke-width="10"/>

    <!-- points: two clusters + inside points -->
    <g fill="#F6F7F8" opacity="0.95">
      <!-- left cluster -->
      <circle cx="150" cy="260" r="7"/>
      <circle cx="170" cy="280" r="6"/>
      <circle cx="140" cy="300" r="6"/>
      <circle cx="175" cy="320" r="7"/>
      <!-- right cluster -->
      <circle cx="440" cy="260" r="7"/>
      <circle cx="460" cy="290" r="6"/>
      <circle cx="430" cy="310" r="6"/>
      <circle cx="455" cy="330" r="7"/>
      <!-- inside quadrat -->
      <circle cx="240" cy="255" r="6"/>
      <circle cx="285" cy="300" r="7"/>
      <circle cx="340" cy="265" r="6"/>
      <circle cx="365" cy="340" r="7"/>
      <circle cx="315" cy="390" r="6"/>
    </g>

    <!-- transect -->
    <path d="M120 450 C 230 410, 320 380, 500 285" fill="none" stroke="#F2F4F8" stroke-width="6" opacity="0.28"/>

    <!-- wordmark inside hex (above quadrat) -->
    <text x="300" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#F2F4F8" letter-spacing="1">spesim</text>
  </g>
</svg>
