<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="spesim logo: hexagon with spatial points and sampling quadrat">
  <defs>
    <linearGradient id="bgA1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <filter id="shadowA1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <clipPath id="clipHexA1">
      <path d="M300 40 L520 165 L520 425 L300 550 L80 425 L80 165 Z"/>
    </clipPath>
  </defs>

  <!-- Hexagon base -->
  <path d="M300 40 L520 165 L520 425 L300 550 L80 425 L80 165 Z" fill="url(#bgA1)" filter="url(#shadowA1)"/>
  <path d="M300 40 L520 165 L520 425 L300 550 L80 425 L80 165 Z" fill="none" stroke="#E0E1DD" stroke-width="10"/>

  <!-- Content clipped to hex -->
  <g clip-path="url(#clipHexA1)">
    <!-- soft environmental blobs -->
    <circle cx="130" cy="190" r="230" fill="#3A506B" opacity="0.35"/>
    <circle cx="520" cy="410" r="260" fill="#5BC0BE" opacity="0.18"/>

    <!-- quadrat (sampling frame) -->
    <rect x="210" y="230" width="180" height="180" fill="none" stroke="#5BC0BE" stroke-width="10"/>

    <!-- points (individuals) – some inside quadrat -->
    <g fill="#F6F7F8" opacity="0.95">
      <!-- outside -->
      <circle cx="160" cy="230" r="8"/>
      <circle cx="190" cy="320" r="6"/>
      <circle cx="140" cy="380" r="7"/>
      <circle cx="250" cy="190" r="6"/>
      <circle cx="420" cy="220" r="8"/>
      <circle cx="460" cy="310" r="6"/>
      <circle cx="420" cy="390" r="7"/>
      <circle cx="330" cy="450" r="6"/>
      <circle cx="250" cy="470" r="8"/>
      <circle cx="190" cy="430" r="6"/>
      <!-- inside quadrat (x 210–390, y 230–410) -->
      <circle cx="255" cy="265" r="7"/>
      <circle cx="300" cy="320" r="6"/>
      <circle cx="355" cy="295" r="7"/>
      <circle cx="330" cy="385" r="6"/>
    </g>

    <!-- subtle transect line -->
    <path d="M110 460 C 220 420, 310 380, 490 300" fill="none" stroke="#E0E1DD" stroke-width="6" opacity="0.35"/>

    <!-- wordmark inside hex (above quadrat) -->
    <text x="300" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#E0E1DD" letter-spacing="1">spesim</text>
  </g>
</svg>
