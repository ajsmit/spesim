<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="690" viewBox="0 0 600 690" role="img" aria-label="spesim logo: hexagon with three environmental gradients">
  <defs>
    <clipPath id="clipHexC">
      <path d="M300 40 L520 165 L520 425 L300 550 L80 425 L80 165 Z"/>
    </clipPath>
    <linearGradient id="tri1" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#2D1E2F"/>
      <stop offset="100%" stop-color="#E07A5F"/>
    </linearGradient>
    <linearGradient id="tri2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1D3557"/>
      <stop offset="100%" stop-color="#A8DADC"/>
    </linearGradient>
    <linearGradient id="tri3" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0%" stop-color="#2A9D8F"/>
      <stop offset="100%" stop-color="#264653"/>
    </linearGradient>
  </defs>

  <path d="M300 40 L520 165 L520 425 L300 550 L80 425 L80 165 Z" fill="#111827"/>
  <path d="M300 40 L520 165 L520 425 L300 550 L80 425 L80 165 Z" fill="none" stroke="#F3F4F6" stroke-width="10"/>

  <g clip-path="url(#clipHexC)">
    <!-- three gradient wedges -->
    <path d="M300 295 L80 165 L300 40 Z" fill="url(#tri2)" opacity="0.95"/>
    <path d="M300 295 L520 165 L300 40 Z" fill="url(#tri1)" opacity="0.95"/>
    <path d="M300 295 L520 425 L80 425 Z" fill="url(#tri3)" opacity="0.95"/>

    <!-- overlaid points -->
    <g fill="#F3F4F6" opacity="0.95">
      <circle cx="175" cy="195" r="7"/>
      <circle cx="250" cy="140" r="6"/>
      <circle cx="360" cy="125" r="7"/>
      <circle cx="435" cy="185" r="6"/>
      <circle cx="210" cy="330" r="7"/>
      <circle cx="300" cy="270" r="6"/>
      <circle cx="390" cy="335" r="7"/>
      <circle cx="260" cy="455" r="6"/>
      <circle cx="350" cy="460" r="7"/>
    </g>

    <!-- small legend glyphs (temp/elev/rain) -->
    <g font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" opacity="0.9">
      <rect x="115" y="445" width="22" height="22" fill="#A8DADC"/>
      <text x="145" y="463">temp</text>
      <rect x="210" y="445" width="22" height="22" fill="#E07A5F"/>
      <text x="240" y="463">elev</text>
      <rect x="305" y="445" width="22" height="22" fill="#2A9D8F"/>
      <text x="335" y="463">rain</text>
    </g>
  </g>

  <text x="300" y="635" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#111827">spesim</text>
</svg>
