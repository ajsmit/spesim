<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="600"><svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="600"><svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="spesim logo: hexagon with spatial points, sampling quadrat, and internal wordmark">
  <defs>
    <linearGradient id="bgA3" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0B132B"></stop>
      <stop offset="100%" stop-color="#1C2541"></stop>
    </linearGradient>
    <radialGradient id="spotA3" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#5BC0BE" stop-opacity="0.35"></stop>
      <stop offset="100%" stop-color="#5BC0BE" stop-opacity="0.00"></stop>
    </radialGradient>
    <filter id="shadowA3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"></feDropShadow>
    </filter>
    <clipPath id="clipHexA3">
      <path d="M300 40 L520 165 L520 425 L300 550 L80 425 L80 165 Z"></path>
    </clipPath>
  </defs>

  <!-- Hexagon base -->
  <path d="M300 40 L520 165 L520 425 L300 550 L80 425 L80 165 Z" fill="url(#bgA3)" filter="url(#shadowA3)"></path>
  <path d="M300 40 L520 165 L520 425 L300 550 L80 425 L80 165 Z" fill="none" stroke="#E0E1DD" stroke-width="10"></path>

  <g clip-path="url(#clipHexA3)">
    <!-- spotlight -->
    <rect x="80" y="120" width="440" height="430" fill="url(#spotA3)"></rect>

    <!-- quadrat -->
    <rect x="210" y="230" width="180" height="180" fill="none" stroke="#5BC0BE" stroke-width="10"></rect>

    <!-- points: more inside quadrat -->
    <g fill="#F6F7F8" opacity="0.95">
      <!-- inside quadrat (x 210–390, y 230–410) -->
      <circle cx="235" cy="250" r="6"></circle>
      <circle cx="260" cy="310" r="7"></circle>
      <circle cx="290" cy="360" r="6"></circle>
      <circle cx="325" cy="260" r="7"></circle>
      <circle cx="350" cy="320" r="6"></circle>
      <circle cx="370" cy="385" r="7"></circle>

      <!-- outside -->
      <circle cx="155" cy="235" r="7"></circle>
      <circle cx="175" cy="345" r="6"></circle>
      <circle cx="140" cy="400" r="7"></circle>
      <circle cx="245" cy="190" r="6"></circle>
      <circle cx="410" cy="215" r="7"></circle>
      <circle cx="460" cy="315" r="6"></circle>
      <circle cx="425" cy="415" r="7"></circle>
      <circle cx="305" cy="455" r="6"></circle>
      <circle cx="240" cy="475" r="7"></circle>
    </g>

    <!-- transect line -->
    <path d="M105 470 C 220 430, 315 390, 495 305" fill="none" stroke="#E0E1DD" stroke-width="6" opacity="0.28"></path>

    <!-- internal wordmark (above quadrat; no overlap) -->
    <rect x="150" y="145" width="300" height="62" rx="14" fill="#0B132B" opacity="0.55"></rect>
    <text x="300" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#E0E1DD" letter-spacing="1">spesim</text>
  </g>
</svg></svg><style>@media (prefers-color-scheme: light) { :root { filter: none; } }
@media (prefers-color-scheme: dark) { :root { filter: none; } }
</style></svg>